<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <meta name="description"
      content="Questionário de fixação sobre conceitos básicos de HTML e CSS para o curso WDD 130.">
    <meta name="author" content="Vinicius Vieira">
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <h1>Questionário de HTML e CSS</h1>

    <form>
        <!-- Pergunta 1: Text Input -->
        <label for="q1">1. O que significa a sigla CSS?</label>
        <input type="text" id="q1" name="q1">

        <!-- Pergunta 2: Textarea -->
        <label for="q2">2. Como os atributos `id` e `class` são selecionados no CSS?</label>
        <textarea id="q2" name="q2" rows="4"></textarea>

        <!-- Pergunta 3: Select -->
        <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
        <select id="q3" name="q3">
            <option value="" selected disabled>Escolha uma...</option>
            <option value="op1">&lt;!-- Comentário --&gt;</option>
            <option value="op2">/* Comentário */</option>
            <option value="op3">// Comentário</option>
        </select>

        <!-- Pergunta 4: Number Input -->
        <label for="q4">
            4. Qual é a margem inferior dada por esta declaração?
            <code>margin: 10px 5px 15px;</code>
        </label>
        <input type="number" id="q4" name="q4">

        <!-- Botão Submit -->
        <button type="submit">ENVIAR QUESTIONÁRIO</button>
    </form>
</body>

</html>
